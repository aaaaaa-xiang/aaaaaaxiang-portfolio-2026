<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">

<title>陈宇翔 - 作品集 [ 2026 ] 资深视觉设计丨AIGC丨品牌</title>

<link rel="preload" href="aaaaaaxiang_portfolio-001.webp" as="image">

<style>

body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    user-select:none;
}

.container{
    width:100%;
}

@media (min-width:768px){
    .container{
        max-width:1280px;
    }
}

img{
    width:100%;
    height:auto;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
}


/* =========================
   自定义右键菜单
========================= */

#menu{
    position:fixed;

    background:#111;

    border:1px solid #333;

    padding:8px 0;

    border-radius:6px;

    font-size:14px;

    color:#fff;

    display:none;

    z-index:9999;

    min-width:140px;

    box-shadow:0 4px 16px rgba(0,0,0,.4);
}

.menu-item{
    padding:8px 14px;
    cursor:pointer;
}

.menu-item:hover{
    background:#222;
}

</style>

</head>


<body>


<!-- =========================
     作品集
========================= -->

<div
    class="container"
    id="portfolio">
</div>


<!-- =========================
     自定义右键菜单
========================= -->

<div id="menu">

    <div
        class="menu-item"
        id="download">
        保存作品集
    </div>

</div>


<script>


/* =========================================================
   图片加载设置
========================================================= */

const container =
    document.getElementById("portfolio");


const maxImages = 99;

const images = [];

let nextIndex = 1;

let activeCount = 0;


/* =========================================================
   创建图片
========================================================= */

for(
    let i = 1;
    i <= maxImages;
    i++
){

    /*
        三位数字：

        001
        002
        003
        ...
        099
    */

    const num =
        String(i).padStart(3,"0");


    const img =
        document.createElement("img");


    /*
        实际文件名：

        aaaaaaxiang_portfolio-001.webp
        aaaaaaxiang_portfolio-002.webp
        aaaaaaxiang_portfolio-003.webp
        ...
    */

    img.dataset.src =
        `aaaaaaxiang_portfolio-${num}.webp`;


    /*
        第一张图片提高加载优先级
    */

    if(i === 1){

        img.setAttribute(
            "fetchpriority",
            "high"
        );

    }


    /* =====================================================
       图片加载成功
    ===================================================== */

    img.onload = function(){

        activeCount =
            Math.max(
                0,
                activeCount - 1
            );

        startNext();

    };


    /* =====================================================
       图片加载失败
    ===================================================== */

    img.onerror = function(){

        /*
            删除不存在的图片
        */

        this.remove();


        activeCount =
            Math.max(
                0,
                activeCount - 1
            );


        startNext();

    };


    images.push(img);

    container.appendChild(img);

}


/* =========================================================
   图片加载控制
   同时最多加载 2 张
========================================================= */

function startNext(){

    while(
        activeCount < 2 &&
        nextIndex <= maxImages
    ){

        const img =
            images[nextIndex - 1];


        /*
            防止重复加载
        */

        if(
            !img ||
            img.dataset.loading === "1"
        ){

            nextIndex++;

            continue;

        }


        /*
            标记正在加载
        */

        img.dataset.loading = "1";


        /*
            设置真实图片地址
        */

        img.src =
            img.dataset.src;


        /*
            当前加载数量 +1
        */

        activeCount++;


        /*
            下一张
        */

        nextIndex++;

    }

}


/* =========================================================
   开始加载
========================================================= */

startNext();



/* =========================================================
   自定义右键菜单
========================================================= */

const menu =
    document.getElementById("menu");


/*
    鼠标右键
*/

document.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();


        /*
            防止菜单超出屏幕
        */

        menu.style.display =
            "block";


        const menuWidth =
            menu.offsetWidth;

        const menuHeight =
            menu.offsetHeight;


        let left =
            e.clientX;

        let top =
            e.clientY;


        if(
            left + menuWidth >
            window.innerWidth
        ){

            left =
                window.innerWidth -
                menuWidth -
                5;

        }


        if(
            top + menuHeight >
            window.innerHeight
        ){

            top =
                window.innerHeight -
                menuHeight -
                5;

        }


        menu.style.left =
            left + "px";

        menu.style.top =
            top + "px";

    }
);


/*
    点击其他位置关闭菜单
*/

document.addEventListener(
    "click",
    function(e){

        if(
            !menu.contains(e.target)
        ){

            menu.style.display =
                "none";

        }

    }
);


/* =========================================================
   下载作品集
========================================================= */

document
    .getElementById("download")
    .addEventListener(
        "click",
        function(e){

            e.stopPropagation();

            /*
                关闭右键菜单
            */

            menu.style.display = "none";


            /*
                作品集原图地址
            */

            const downloadUrl =
                "aaaaaaxiang_portfolio.jpg";


            /*
                下载后的文件名
            */

            const fileName =
                "陈宇翔 - 作品集 [ 2026 ] 资深视觉设计丨AIGC丨品牌.jpg";


            /*
                创建隐藏下载链接
            */

            const a =
                document.createElement("a");


            a.href =
                downloadUrl;


            /*
                指定下载文件名
            */

            a.setAttribute(
                "download",
                fileName
            );

            a.setAttribute(
                "target",
                "_self"
            );


            /*
                隐藏链接
            */

            a.style.display =
                "none";


            /*
                加入页面
            */

            document.body.appendChild(a);


            /*
                执行下载
            */

            a.click();


            /*
                清理
            */

            setTimeout(
                function(){

                    document.body.removeChild(a);

                },
                1000
            );

        }
    );


/* =========================================================
   禁止拖拽
========================================================= */

document.addEventListener(
    "dragstart",
    function(e){

        e.preventDefault();

    }
);

</script>

</body>

</html>
